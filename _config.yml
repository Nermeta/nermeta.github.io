title: "Wynter's Wonderland"
email: wynter@davaga.net
description: >-
  Adventures in learning — cybersecurity, technology, and the things
  that catch my curiosity. Where nothing is quite what it seems, but everything is interesting.
baseurl: ""
url: "https://nermeta.github.io"
github_username: Nermeta

# ── Theme ──────────────────────────────────────────────────────
# Custom theme — Slate is replaced entirely.
# cheshire_portrait: /assets/images/cheshire-face.png   # uncomment when commissioned art arrives

# ── Build ──────────────────────────────────────────────────────
plugins:
  - jekyll-feed

exclude:
  - scripts/
  - cloudflare-worker/
  - "*.tar.gz"
  - context.json
  - wrangler.jsonc
  - node_modules/
  - vendor/

# ── Collections ────────────────────────────────────────────────
collections:
  pages:
    output: true
    permalink: /:name/
  learning-logs:
    output: true
    permalink: /learning-logs/:name/
  certifications:
    output: false
    sort_by: date
    permalink: /certifications/:name/
  book-reviews:
    output: true
    permalink: /book-reviews/:name/
  deep-dives:
    output: true
    permalink: /deep-dives/:name/
  tutorials:
    output: true
    permalink: /tutorials/:name/
  writeups:
    output: true
    permalink: /writeups/:name/

# ── Frontmatter defaults ───────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: "learning-logs"
    values:
      layout: post
      public: true
  - scope:
      path: ""
      type: "certifications"
    values:
      layout: post
      public: true
  - scope:
      path: ""
      type: "book-reviews"
    values:
      layout: post
      public: true
  - scope:
      path: ""
      type: "deep-dives"
    values:
      layout: post
      public: true
  - scope:
      path: ""
      type: "tutorials"
    values:
      layout: post
      public: true
  - scope:
      path: ""
      type: "writeups"
    values:
      layout: post
      public: true
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      public: true
