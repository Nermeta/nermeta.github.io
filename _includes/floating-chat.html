<!-- Floating Cheshire chat button — shown on all pages except home -->
<div class="floating-chat" id="floatingChat" aria-label="Chat with Cheshire" role="complementary">

  <!-- Collapsed button -->
   <button class="floating-chat-trigger" id="chatTrigger" aria-expanded="false" aria-controls="chatDrawer" aria-label="Ask Cheshire">
    <svg class="chat-trigger-icon" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="32" height="32">
      <!-- Ears -->
      <polygon points="6,16 10,4 16,14" fill="currentColor" opacity="0.85"/>
      <polygon points="38,16 34,4 28,14" fill="currentColor" opacity="0.85"/>
      <polygon points="7.5,14.5 10.5,7 15,13" fill="var(--fuchsia)" opacity="0.6"/>
      <polygon points="36.5,14.5 33.5,7 29,13" fill="var(--fuchsia)" opacity="0.6"/>
      <!-- Head -->
      <ellipse cx="22" cy="24" rx="15" ry="14" fill="currentColor" opacity="0.9"/>
      <!-- Eyes — Cheshire grin shape: slightly tilted -->
      <ellipse cx="16" cy="21" rx="2.8" ry="3.2" fill="var(--bg)" opacity="1"/>
      <ellipse cx="28" cy="21" rx="2.8" ry="3.2" fill="var(--bg)" opacity="1"/>
      <ellipse cx="16.4" cy="21.5" rx="1.4" ry="2" fill="var(--aqua)" opacity="1"/>
      <ellipse cx="28.4" cy="21.5" rx="1.4" ry="2" fill="var(--aqua)" opacity="1"/>
      <!-- Grin -->
      <path d="M15 28.5 Q22 33.5 29 28.5" stroke="var(--bg)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- Whiskers -->
      <line x1="2" y1="25" x2="13" y2="26" stroke="var(--bg)" stroke-width="1" opacity="0.6"/>
      <line x1="2" y1="28" x2="13" y2="27.5" stroke="var(--bg)" stroke-width="1" opacity="0.6"/>
      <line x1="31" y1="26" x2="42" y2="25" stroke="var(--bg)" stroke-width="1" opacity="0.6"/>
      <line x1="31" y1="27.5" x2="42" y2="28" stroke="var(--bg)" stroke-width="1" opacity="0.6"/>
    </svg>
    <span class="floating-chat-tooltip">Ask Cheshire</span>
  </button>

  <!-- Expanded drawer -->
  <div class="chat-drawer" id="chatDrawer" hidden>
    <div class="chat-drawer-header">
      <div class="chat-status-dot" aria-hidden="true"></div>
      <span class="chat-drawer-title">Cheshire <span class="chat-drawer-sub">· navigation guide</span></span>
      <button class="chat-drawer-close" id="chatClose" aria-label="Close chat">✕</button>
    </div>

    <div class="chat-messages" id="drawerMessages" role="log" aria-live="polite" aria-label="Chat messages">
      <div class="msg-ai">
        <div class="msg-ai-avatar" aria-hidden="true">🐱</div>
        <div class="msg-bubble">
          Lost? That's rather the point.<br>
          Tell me what you're after.
        </div>
      </div>
    </div>

    <div class="chat-chips" id="drawerChips" role="group" aria-label="Suggested questions">
      <button class="chip">What's new here?</button>
      <button class="chip">Show recent writeups</button>
      <button class="chip">Any certs?</button>
    </div>

    <form class="chat-input-row" id="drawerForm">
      <textarea
        class="chat-input"
        id="drawerInput"
        rows="1"
        placeholder="Ask anything…"
        aria-label="Chat input"
      ></textarea>
      <button class="chat-send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

</div>

<script src="{{ '/assets/js/chat.js' | relative_url }}" defer></script>
