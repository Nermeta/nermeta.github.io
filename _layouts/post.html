---
layout: default
---
<main class="page-content" id="main-content">
  <article>
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>
      <div class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">
          {{ page.date | date: "%B %d, %Y" }}
        </time>
        {% if page.collection %}
          <span class="post-tag">{{ page.collection | replace: '-', ' ' }}</span>
        {% endif %}
        {% for tag in page.tags %}
          <span class="post-tag">{{ tag }}</span>
        {% endfor %}
        {% if page.difficulty %}
          <span class="post-tag">{{ page.difficulty }}</span>
        {% endif %}
      </div>
    </header>

    <div class="post-body">
      {{ content }}
    </div>
  </article>
</main>
