---
layout: default
---
<main class="letter-main" id="main-content">

  <article class="letter">

    <!-- side flourishes -->
    <div class="letter-flourish letter-flourish--left" aria-hidden="true">
      <svg viewBox="0 0 40 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <!-- top swirl -->
        <path d="M20 10 C10 10, 4 18, 8 26 C12 34, 22 30, 20 22 C18 14, 10 16, 12 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        <!-- top loop accent -->
        <path d="M8 26 C4 36, 6 48, 14 50 C22 52, 28 44, 24 36" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
        <!-- main vertical stem with gentle wave -->
        <path d="M16 50 C14 80, 22 100, 18 130 C14 160, 22 180, 18 210 C14 240, 22 260, 18 290" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        <!-- mid flourish curl left -->
        <path d="M18 130 C10 124, 4 130, 6 138 C8 146, 18 144, 18 136" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
        <!-- mid flourish curl right -->
        <path d="M18 180 C26 174, 32 180, 30 188 C28 196, 18 194, 18 186" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
        <!-- bottom loop -->
        <path d="M18 290 C16 302, 10 308, 8 316 C10 320, 16 318, 20 312 C24 306, 22 298, 18 294" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        <!-- small dot cap -->
        <circle cx="8" cy="317" r="1.2" fill="currentColor"/>
      </svg>
    </div>

    <div class="letter-flourish letter-flourish--right" aria-hidden="true">
      <svg viewBox="0 0 40 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <!-- mirror: top swirl -->
        <path d="M20 10 C30 10, 36 18, 32 26 C28 34, 18 30, 20 22 C22 14, 30 16, 28 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        <path d="M32 26 C36 36, 34 48, 26 50 C18 52, 12 44, 16 36" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
        <path d="M24 50 C26 80, 18 100, 22 130 C26 160, 18 180, 22 210 C26 240, 18 260, 22 290" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        <path d="M22 130 C30 124, 36 130, 34 138 C32 146, 22 144, 22 136" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
        <path d="M22 180 C14 174, 8 180, 10 188 C12 196, 22 194, 22 186" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
        <path d="M22 290 C24 302, 30 308, 32 316 C30 320, 24 318, 20 312 C16 306, 18 298, 22 294" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        <circle cx="32" cy="317" r="1.2" fill="currentColor"/>
      </svg>
    </div>

    <!-- paper -->
    <div class="letter-paper">

      <!-- header: date -->
      <header class="letter-head">
        <span class="letter-date">{{ site.time | date: "%B %Y" }}</span>
      </header>

      <!-- top divider -->
      <div class="letter-divider" aria-hidden="true">
        <span class="letter-rule"></span>
        <span class="letter-ornament">✦</span>
        <span class="letter-rule"></span>
      </div>

      <!-- salutation -->
      <p class="letter-salutation">To whoever finds their way here,</p>

      <!-- body -->
      <div class="letter-body">
        {{ content }}
      </div>

      <!-- closing -->
      <footer class="letter-closing">
        <div class="letter-divider letter-divider--closing" aria-hidden="true">
          <span class="letter-rule"></span>
          <span class="letter-ornament">✦</span>
          <span class="letter-rule"></span>
        </div>
        <div class="letter-sign-block">
          <p class="letter-valediction">With curiosity,</p>
          <p class="letter-signature">Wynter</p>
          <p class="letter-postscript">P.S. — The Cheshire Cat in the corner can help you find your way around if you'd rather just ask.</p>
        </div>
      </footer>

    </div><!-- /.letter-paper -->

  </article>

</main>

<style>
/* ── About — Letter Layout ──────────────────────────────────── */

:root {
  --lt-paper:       #0d0d10;
  --lt-paper-edge:  #080809;
  --lt-ink:         #ccc8d8;
  --lt-ink-dim:     #7a7690;
  --lt-ink-muted:   #484560;
  --lt-gold:        #c9a84c;
  --lt-gold-dim:    #8a6e2a;
  --lt-rule:        rgba(201,168,76,0.12);
  --lt-border:      rgba(201,168,76,0.16);
  --lt-flourish:    rgba(201,168,76,0.28);
}

.letter-main {
  display: flex;
  justify-content: center;
  padding: 2rem 4rem 6rem;
}

/* ── Wrapper holds flourishes + paper ── */
.letter {
  width: 100%;
  max-width: 700px;
  position: relative;
}

/* ── Side flourishes ── */
.letter-flourish {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 320px;
  color: var(--lt-flourish);
  pointer-events: none;
}

.letter-flourish--left  { right: calc(100% + 12px); }
.letter-flourish--right { left:  calc(100% + 12px); }

.letter-flourish svg {
  width: 100%;
  height: 100%;
}

/* ── Letter card ── */
.letter-paper {
  background: var(--lt-paper);
  border: 1px solid var(--lt-border);
  border-radius: 2px;
  padding: 2.25rem 3.5rem 3rem;
  box-shadow:
    0 0 0 4px rgba(201,168,76,0.03),
    3px 3px 0 var(--lt-paper-edge),
    6px 6px 0 rgba(0,0,0,0.3),
    0 24px 64px rgba(0,0,0,0.55);
  background-image:
    radial-gradient(ellipse at 25% 8%,  rgba(120,110,180,0.04) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 92%, rgba(201,168,76,0.02) 0%, transparent 55%);
  position: relative;
}

/* inner decorative frame */
.letter-paper::before {
  content: '';
  position: absolute;
  inset: 10px;
  border: 1px solid rgba(201,168,76,0.05);
  border-radius: 1px;
  pointer-events: none;
}

/* ── Header ── */
.letter-head {
  margin-bottom: 0.75rem;
}

.letter-date {
  font-family: 'Cinzel', serif;
  font-size: 0.58rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--lt-ink-muted);
  display: block;
}

/* ── Ornamental divider ── */
.letter-divider {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1.75rem;
}

.letter-rule {
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--lt-gold-dim), transparent);
}

.letter-ornament {
  font-size: 0.55rem;
  color: var(--lt-gold-dim);
  letter-spacing: 0.3em;
  font-family: 'Cinzel', serif;
}

/* ── Salutation ── */
.letter-salutation {
  font-family: 'Raleway', system-ui, sans-serif;
  font-size: 0.9rem;
  font-weight: 300;
  letter-spacing: 0.03em;
  color: var(--lt-ink-dim);
  margin: 0 0 1.75rem;
  font-style: italic;
}

/* ── Body ── */
.letter-body {
  font-family: 'Raleway', system-ui, sans-serif;
  font-size: 0.95rem;
  line-height: 1.9;
  color: var(--lt-ink);
}

.letter-body p {
  margin: 0 0 1.4em;
}

.letter-body p:last-child {
  margin-bottom: 0;
}

/* Drop cap on the very first paragraph */
.letter-body > p:first-child::first-letter {
  font-family: 'Cinzel Decorative', serif;
  font-size: 3.4em;
  font-weight: 700;
  color: var(--lt-gold);
  float: left;
  line-height: 0.78;
  margin: 0.06em 0.1em 0 0;
  text-shadow: 0 0 24px rgba(201,168,76,0.25);
}

.letter-body a {
  color: var(--lt-gold-dim);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.letter-body a:hover { color: var(--lt-gold); }

/* ── Closing ── */
.letter-closing {
  margin-top: 2.25rem;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.letter-divider--closing {
  margin-bottom: 1.5rem;
}

.letter-sign-block {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  padding-left: 0.25rem;
}

.letter-valediction {
  font-family: 'Raleway', system-ui, sans-serif;
  font-size: 0.8rem;
  font-weight: 300;
  letter-spacing: 0.06em;
  color: var(--lt-ink-dim);
  margin: 0;
  font-style: italic;
}

.letter-signature {
  font-family: 'Cinzel Decorative', serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--lt-gold);
  margin: 0.2em 0 0;
  text-shadow: 0 0 20px rgba(201,168,76,0.2);
  line-height: 1.2;
}

.letter-postscript {
  font-family: 'Raleway', system-ui, sans-serif;
  font-size: 0.75rem;
  color: var(--lt-ink-muted);
  line-height: 1.65;
  margin: 1rem 0 0;
  font-style: italic;
  border-top: 1px solid var(--lt-rule);
  padding-top: 0.85rem;
}

/* ── Responsive ── */
@media (max-width: 780px) {
  .letter-main { padding-left: 1.5rem; padding-right: 1.5rem; }
  .letter-flourish { display: none; }
  .letter-paper { padding: 2rem 1.75rem; }
  .letter-signature { font-size: 1.3rem; }
}
</style>
